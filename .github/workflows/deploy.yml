name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build Docker images and push to ECR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO"
          docker build \
            --build-arg VITE_API_URL=/api \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_BACKEND_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO"
          docker build \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:latest" \
            ./backend
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  # ─────────────────────────────────────────────────────────────
  # Job 2: Deploy to EC2
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            cd /opt/portfolio

            # Pull latest code (nginx.prod.conf, docker-compose.prod.yml, etc.)
            git pull origin main

            # Set image URLs for compose
            export ECR_FRONTEND_URL="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_FRONTEND_REPO }}"
            export ECR_BACKEND_URL="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_BACKEND_REPO }}"

            # Pull new images
            docker compose -f docker-compose.prod.yml pull

            # Restart with zero-downtime (new containers before old ones stop)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Cleanup old images to save disk space
            docker image prune -f

            # Health check
            sleep 5
            curl -sf http://localhost/api/health || (echo "Health check failed!" && exit 1)

            echo "Deployment successful!"
