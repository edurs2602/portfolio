# ─── Rate Limiting Zones ─────────────────────────────────────
# General: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# Contact form: 3 req/min per IP
limit_req_zone $binary_remote_addr zone=contact:10m rate=3r/m;
# Admin login: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    # ─── Hide server version ─────────────────────────────────
    server_tokens off;

    # ─── Request size limits ─────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ─── Security Headers ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Static files with caching ───────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── SPA fallback ────────────────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ─── Contact form endpoint (strict rate limit) ───────────
    location = /api/contact {
        limit_req zone=contact burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Login endpoint (brute-force protection) ─────────────
    location = /api/admin/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API proxy (general rate limit) ──────────────────────
    location /api/ {
        limit_req zone=general burst=10 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ─── Block common attack paths ───────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    location ~ ^/(wp-admin|wp-login|phpmyadmin|administrator|xmlrpc) {
        deny all;
        return 404;
    }
}
