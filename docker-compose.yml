services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build: ./backend
    # Not exposed externally — only accessible via nginx proxy
    expose:
      - "8000"
    env_file: ./backend/.env
    volumes:
      - sqlite_data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Resource limits to mitigate abuse
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  sqlite_data:
