services:
  # The frontend image is nginx:alpine + built dist (multi-stage).
  # We override the nginx config with the production one and mount SSL certs.
  frontend:
    image: ${ECR_FRONTEND_URL}:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Renews Let's Encrypt certs every 12h
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

  backend:
    image: ${ECR_BACKEND_URL}:latest
    expose:
      - "8000"
    env_file: ./backend/.env
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  certbot-etc:
  certbot-www:
  sqlite_data:
